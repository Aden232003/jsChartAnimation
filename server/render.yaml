services:
  - type: web
    name: jschart-backend
    env: node
    rootDir: server
    buildCommand: cd . && npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://jschart-night.vercel.app
    healthCheckPath: /health
    autoDeploy: true 